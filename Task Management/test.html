<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Login</title>
    <style>
        /* style.css */
body {
    margin: 0;
    padding: 0;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(to bottom right, #e1eec3, #f05053); /* Example gradient */
    overflow: hidden; /* Prevents scrollbars on background */
}

.container {
    position: relative;
    width: 400px; /* Adjust as needed */
    height: 350px; /* Adjust as needed */
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    position: relative;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.1); /* Glass effect */
    border-radius: 20px;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
    padding: 40px;
    box-sizing: border-box;
}

.login-box h2 {
    margin: 0 0 30px;
    padding: 0;
    color: #fff;
    text-align: center;
}

.input-box {
    position: relative;
    width: 100%;
    margin-bottom: 20px;
}

.input-box input {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: none;
    outline: none;
    border-bottom: 1px solid #fff;
    font-size: 16px;
    color: #fff;
    box-sizing: border-box;
}

.input-box label {
    position: absolute;
    top: 0;
    left: 0;
    padding: 10px;
    font-size: 16px;
    color: #fff;
    pointer-events: none;
    transition: .5s;
}

.input-box input:focus ~ label,
.input-box input:valid ~ label {
    top: -20px;
    font-size: 12px;
}

button {
    width: 100%;
    background: #fff;
    border: none;
    outline: none;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
    color: #000;
    transition: background-color 0.3s ease; /* Smooth transition for hover */
}

button:hover {
    background-color: #eee; /* Slightly darker background on hover */
}

.forgot {
    margin-top: 10px;
    text-align: center;
}

.forgot a {
    color: #fff;
    text-decoration: none;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h2>Login</h2>
            <form>
                <div class="input-box">
                    <input type="text" required>
                    <label>Username</label>
                </div>
                <div class="input-box">
                    <input type="password" required>
                    <label>Password</label>
                </div>
                <button type="submit">Login</button>
                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
